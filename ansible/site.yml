---
- name: Base configuration
  hosts: all
  become: true
  tasks:
    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure PostgreSQL
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: change-me

  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present

    - name: Start PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow remote database connections
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 scram-sha-256"
      notify: Restart PostgreSQL

    - name: Create database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        state: present
      become_user: postgres
      no_log: true

    - name: Create application database
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Deploy Notes API
  hosts: web
  become: true
  vars:
    database_url: postgresql://notes:change-me@db:5432/notes

  tasks:
    - name: Install application dependencies
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/notes
        state: directory
        owner: ansible
        group: ansible
        mode: '0755'

    - name: Clone application repository
      ansible.builtin.git:
        repo: https://github.com/SKrastanov/devops-labs-fn371223018.git
        dest: /opt/notes
        version: main
      become_user: ansible
      notify: Restart notes

    - name: Install Python requirements
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv
      become_user: ansible
      notify: Restart notes

    - name: Configure systemd service
      ansible.builtin.template:
        src: notes.service.j2
        dest: /etc/systemd/system/notes.service
        mode: '0644'
      notify: Restart notes

    - name: Enable and start Notes API
      ansible.builtin.systemd:
        name: notes
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true

- name: Configure Nginx load balancer
  hosts: lb
  become: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Configure Nginx
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: '0644'
      notify: Reload nginx

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
